[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev"
version = "0.1.0"
requires-python = ">=3.11"
description = "Fail-closed foundation for hybrid agentic software development"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyright>=1.1.400,<2", "build>=1.2,<2"]

[project.scripts]
agentdev = "agentdev.cli:main"

[tool.setuptools.packages.find]
include = ["agentdev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
