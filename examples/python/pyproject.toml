[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "agentdev-python-smoke"
version = "0.1.0"
requires-python = ">=3.11"
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyright>=1.1.400,<2", "build>=1.2,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pyright]
include = ["src", "tests"]
[tool.pytest.ini_options]
testpaths = ["tests"]
