name = "dotnet"
[commands]
setup = ["dotnet", "restore", "AgentDev.slnx"]
format_check = ["dotnet", "format", "AgentDev.slnx", "--verify-no-changes", "--no-restore"]
lint = ["dotnet", "build", "AgentDev.slnx", "--no-restore", "-warnaserror"]
